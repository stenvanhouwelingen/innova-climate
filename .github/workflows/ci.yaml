name: Continuous Integration & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  hassfest:
    name: Home Assistant Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Action Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"

  pytest:
    name: Python Test Suite & Library Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pymodbus pyserial

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=innova_modbus/src pytest innova_modbus/tests -v

  esphome:
    name: Validate ESPHome Configurations & Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: |
          pip install --upgrade pip
          pip install esphome

      - name: Create Test Secrets
        run: |
          cat << 'EOF' > secrets.yaml
          wifi_ssid: "TestWiFi"
          wifi_password: "TestPassword"
          fallback_ap_password: "TestPassword123"
          api_key: "EmdRegYL+GFqTKUoFf31L6hB+P/W3sOkprv1hZNBo04="
          ota_password: "TestPassword123"
          EOF

      - name: Validate M5Stack NanoC6 Serial Proxy (ESP32-C6)
        run: |
          esphome config examples/m5nanoc6-serial-proxy.yaml

      - name: Validate M5Stack Atom Lite Serial Proxy (ESP32)
        run: |
          esphome config examples/m5atom-serial-proxy.yaml

      - name: Validate Standalone Legacy Package D (n273025d)
        run: |
          cat << 'EOF' > test_n273025d.yaml
          substitutions:
            room_name: "test"
            friendly_room_name: "Test"

          external_components:
            - source:
                type: local
                path: components

          esphome:
            name: "innova-test"
            friendly_name: "Innova Test"

          esp32:
            board: esp32-c6-devkitm-1
            framework:
              type: esp-idf

          logger:
            level: DEBUG

          wifi:
            ssid: "Test"
            password: "Password123"

          api:
            encryption:
              key: "EmdRegYL+GFqTKUoFf31L6hB+P/W3sOkprv1hZNBo04="

          ota:
            - platform: esphome

          uart:
            id: modbus_uart
            tx_pin: 2
            rx_pin:
              number: 1
              mode: INPUT_PULLUP
            baud_rate: 9600
            stop_bits: 1
            rx_timeout: 10

          modbus:
            id: modbus_bus
            uart_id: modbus_uart
            send_wait_time: 500ms

          packages:
            innova_board: !include packages/innova_n273025d.yaml
          EOF
          esphome config test_n273025d.yaml

      - name: Validate Standalone Legacy Package C (n273025c)
        run: |
          cat << 'EOF' > test_n273025c.yaml
          substitutions:
            room_name: "test"
            friendly_room_name: "Test"

          external_components:
            - source:
                type: local
                path: components

          esphome:
            name: "innova-test"
            friendly_name: "Innova Test"

          esp32:
            board: esp32-c6-devkitm-1
            framework:
              type: esp-idf

          logger:
            level: DEBUG

          wifi:
            ssid: "Test"
            password: "Password123"

          api:
            encryption:
              key: "EmdRegYL+GFqTKUoFf31L6hB+P/W3sOkprv1hZNBo04="

          ota:
            - platform: esphome

          uart:
            id: modbus_uart
            tx_pin: 2
            rx_pin:
              number: 1
              mode: INPUT_PULLUP
            baud_rate: 9600
            stop_bits: 1
            rx_timeout: 10

          modbus:
            id: modbus_bus
            uart_id: modbus_uart
            send_wait_time: 500ms

          packages:
            innova_board: !include packages/innova_n273025c.yaml
          EOF
          esphome config test_n273025c.yaml
